name: actify
description: AI-powered action intelligence mobile application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  provider: ^6.1.5
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  supabase_flutter: ^2.9.0

# Add OCR, camera, file selection and notifications packages as each MVP feature is implemented.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
